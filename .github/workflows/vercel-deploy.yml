# Manual-only production deploy of website/ to Vercel. Never push-triggered;
# website/vercel.json also disables Vercel's own git auto-deploy.
# Required repo secrets: VERCEL_ACCESS_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
name: vercel-deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deploy target
        type: choice
        options: [production, preview]
        default: production

concurrency:
  group: vercel-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Pull Vercel project settings
        run: npx vercel pull --yes --environment=${{ inputs.environment }} --token="$VERCEL_TOKEN"
      - name: Build
        run: npx vercel build ${{ inputs.environment == 'production' && '--prod' || '' }} --token="$VERCEL_TOKEN"
      - name: Deploy
        run: npx vercel deploy --prebuilt ${{ inputs.environment == 'production' && '--prod' || '' }} --token="$VERCEL_TOKEN"
